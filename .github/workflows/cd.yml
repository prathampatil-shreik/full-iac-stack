# .github/workflows/cd.yml
#
# Stage 4 — CD pipeline (deploy on merge to main)
#
# Triggered on push to main (i.e. after a PR is merged).
# Uses OIDC to assume the CD IAM role — no long-lived credentials stored.
#
# Jobs:
#   apply-dev   — terraform apply for envs/dev (automatic after merge)
#   apply-prod  — terraform apply for envs/prod (requires manual approval
#                 via GitHub Environment protection rules)
#
# Required GitHub secrets (same as CI plus CD role):
#   AWS_CD_ROLE_ARN    — ARN of the CD IAM role (output of bootstrap/oidc)
#   AWS_REGION
#   TF_VAR_DB_PASSWORD
#   DEV_BUCKET_SUFFIX
#   PROD_BUCKET_SUFFIX
#
# Required GitHub Environments:
#   dev   — no protection rules (auto-deploy)
#   prod  — required reviewers protection rule (manual approval gate)

name: CD

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ── Job 1: Apply dev ─────────────────────────────────────────────────────────
  apply-dev:
    name: Apply dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-apply-dev-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — dev
        working-directory: envs/dev
        run: terraform init -input=false

      - name: terraform plan — dev
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.DEV_BUCKET_SUFFIX }}
        run: terraform plan -input=false -no-color -out=dev.tfplan

      - name: terraform apply — dev
        working-directory: envs/dev
        run: terraform apply -input=false -no-color dev.tfplan

  # ── Job 2: Apply prod ────────────────────────────────────────────────────────
  # Blocked by the GitHub Environment "prod" protection rule until a reviewer
  # approves. The plan is shown in the Actions UI before approval is requested.
  apply-prod:
    name: Apply prod
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: prod          # <-- manual approval gate configured here
    concurrency:
      group: terraform-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-apply-prod-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init — prod
        working-directory: envs/prod
        run: terraform init -input=false

      - name: terraform plan — prod
        working-directory: envs/prod
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_bucket_suffix: ${{ secrets.PROD_BUCKET_SUFFIX }}
        run: terraform plan -input=false -no-color -out=prod.tfplan

      - name: terraform apply — prod
        working-directory: envs/prod
        run: terraform apply -input=false -no-color prod.tfplan
